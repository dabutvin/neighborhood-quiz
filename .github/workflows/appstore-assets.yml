name: App Store Assets

# The PR screenshots are shot on whatever iPhone the runner has and posted for a
# reviewer to glance at — the wrong sizes for the store, and unframed. This is the
# other job: it shoots a chosen few screens on the exact simulators App Review asks
# for — iPhone 6.9 inch and iPad 13 inch — and frames each with a line of copy, so
# what comes out of it uploads straight to App Store Connect.
#
# It is hand-cranked rather than run on every push: store assets are wanted at a
# release, not a commit. Run it from the Actions tab; the framed and raw shots come
# back as a downloadable artifact.

on:
  workflow_dispatch:
    inputs:
      appearance:
        description: Light or dark screens
        required: false
        default: light
        type: choice
        options: [light, dark]

# Write access for the one thing it writes: the appstore-assets branch below.
permissions:
  contents: write

concurrency:
  group: appstore-assets-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  assets:
    name: Capture App Store Assets
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install Pillow
        run: python3 -m pip install --quiet --break-system-packages Pillow

      - name: Build for Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project NeighborhoodQuiz.xcodeproj \
            -scheme NeighborhoodQuiz \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -derivedDataPath DerivedData \
            ARCHS="$(uname -m)" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log
          if grep -q "BUILD FAILED" build.log; then exit 1; fi

      - name: Capture and frame
        env:
          APPEARANCE: ${{ github.event.inputs.appearance || 'light' }}
        run: |
          set -euo pipefail

          BUNDLE_ID="com.nycneighborhoodsquiz.app"
          APP_PATH=$(find DerivedData/Build/Products/Debug-iphonesimulator -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP_PATH" ]; then echo "ERROR: no .app built"; exit 1; fi

          # The screens the store leads with, each with the line of copy it carries.
          # Kept here, in the order they will sit on the listing, so the story a
          # browser reads is set in one place.
          # The game first — a question, then a round filling in — because a map
          # quiz that only shows a map has not said what the game is. Then why the
          # map is worth looking at, then what the money is for.
          SCREENS=(
            "question:-quiz-picked:Find the neighborhood on the map"
            "round:-quiz-filling:Ten places a round, three tries each"
            "streets:-map-zoomed:The streets are your clues"
            "earn:-quiz-over:Bank what you earn"
            "boroughs:-boroughs:Buy the rest of the city, a borough at a time"
            "city:-map-city:All five boroughs"
          )

          # Pick the first simulator on offer whose name matches one we want, and
          # make it if the runner has the device type but has not built one yet.
          pick() {
            local kind="$1"; shift
            local available; available=$(xcrun simctl list devices available)
            local udid=""
            for name in "$@"; do
              udid=$(grep -m1 "^ *$name (" <<< "$available" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/' || true)
              [ -n "$udid" ] && { echo "$udid"; return; }
            done
            # None booted yet — create the first named type against the newest runtime.
            local runtime; runtime=$(xcrun simctl list runtimes | grep -E 'iOS' | tail -1 | sed -E 's/.*(com\.apple[^ ]*).*/\1/')
            for name in "$@"; do
              udid=$(xcrun simctl create "$name" "$name" "$runtime" 2>/dev/null || true)
              [ -n "$udid" ] && { echo "$udid"; return; }
            done
            echo "ERROR: no $kind simulator available" >&2
            echo "$available" >&2
            return 1
          }

          shoot() {
            local label="$1" udid="$2"
            mkdir -p "out/$label/raw" "out/$label/framed"
            xcrun simctl boot "$udid" 2>/dev/null || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl ui "$udid" appearance "$APPEARANCE"
            # The status bar App Review likes: full bars, full battery, 9:41. Given
            # as a whole date first, so the iPad — which shows the day beside the
            # time — reads Tue Jan 9 rather than whatever day the run happened on;
            # if this simctl will not take a date, 9:41 alone. Said out loud either
            # way, since an override that fails quietly leaves the real clock in
            # every shot.
            local stamp applied=""
            for stamp in "2007-01-09T09:41:00Z" "2007-01-09T09:41:00+00:00" "9:41"; do
              if xcrun simctl status_bar "$udid" override \
                  --time "$stamp" --batteryState charged --batteryLevel 100 \
                  --cellularBars 4 --wifiBars 3 --dataNetwork wifi; then
                applied="$stamp"; break
              fi
            done
            if [ -z "$applied" ]; then
              echo "ERROR: the status bar would not take an override on $label"; return 1
            fi
            echo "Status bar on $label: --time $applied"
            xcrun simctl install "$udid" "$APP_PATH"

            local order=1
            for entry in "${SCREENS[@]}"; do
              local slug="${entry%%:*}"; local rest="${entry#*:}"
              local arg="${rest%%:*}"; local caption="${rest#*:}"
              local raw="out/$label/raw/${slug}.png"
              xcrun simctl launch "$udid" "$BUNDLE_ID" "$arg"
              # The whole city is five boroughs drawn at once; give every screen
              # the time that one takes rather than tuning each.
              sleep 5
              xcrun simctl io "$udid" screenshot "$raw"
              xcrun simctl terminate "$udid" "$BUNDLE_ID" 2>/dev/null || true
              python3 Tools/appstore_frames.py \
                --input "$raw" \
                --output "$(printf 'out/%s/framed/%02d_%s.png' "$label" "$order" "$slug")" \
                --caption "$caption" \
                --appearance "$APPEARANCE"
              order=$((order + 1))
            done
            echo "== $label ($APPEARANCE) =="
            ls -la "out/$label/framed" || true
          }

          IPHONE=$(pick "iPhone 6.9-inch" "iPhone 16 Pro Max" "iPhone 17 Pro Max" "iPhone 15 Pro Max")
          IPAD=$(pick "iPad 13-inch" "iPad Pro 13-inch (M4)" "iPad Pro (12.9-inch) (6th generation)" "iPad Pro (12.9-inch) (5th generation)")

          shoot iphone_6_9 "$IPHONE"
          shoot ipad_13 "$IPAD"

          echo "Sizes captured:"
          python3 -c "import glob; from PIL import Image; [print(p, Image.open(p).size) for p in sorted(glob.glob('out/*/framed/*.png'))]"

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: appstore-assets
          path: out/
          if-no-files-found: error

      # And the framed shots on a branch of their own, so they can be looked at on
      # GitHub — or fetched with git — without downloading and unpacking a zip.
      # One folder per appearance and device; a run replaces only its own
      # appearance, so a light run and a dark run sit side by side.
      - name: Publish to the appstore-assets branch
        env:
          APPEARANCE: ${{ github.event.inputs.appearance || 'light' }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          work="$RUNNER_TEMP/appstore-assets"
          if git fetch --depth 1 origin appstore-assets 2>/dev/null; then
            git worktree add --detach "$work" FETCH_HEAD
          else
            git worktree add --detach "$work"
            git -C "$work" checkout --orphan appstore-assets
            git -C "$work" rm -rfq .
          fi

          rm -rf "${work:?}/$APPEARANCE"
          for device in out/*/; do
            name=$(basename "$device")
            mkdir -p "$work/$APPEARANCE/$name"
            cp "$device"framed/*.png "$work/$APPEARANCE/$name/"
          done

          cd "$work"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed since the last run."
            exit 0
          fi
          git commit -qm "App Store assets, $APPEARANCE, from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}"
          git push origin HEAD:refs/heads/appstore-assets
          echo "Published: https://github.com/${GITHUB_REPOSITORY}/tree/appstore-assets/$APPEARANCE"
